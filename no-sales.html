<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>お問い合わせ（営業お断り） | テスト株式会社（ネコノテ検証用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="notice-banner">
  これはネコノテアクションの動作検証用のダミーサイトです。実在の企業ではありません。
</div>

<header>
  <p class="site-title">テスト株式会社（ネコノテ検証用）</p>
</header>

<nav>
  <a href="index.html">会社概要</a>
  <a href="contact.html">お問い合わせ</a>
  <a href="contact2.html">お問い合わせ（詳細フォーム）</a>
</nav>

<main>
  <h1>お問い合わせ</h1>

  <div class="no-sales-banner">
    営業・セールス目的のお問い合わせはお断りしております。営業お断り。
  </div>

  <p>以下のフォームに必要事項をご記入のうえ、送信してください。</p>

  <form method="GET" action="thanks.html">
    <div class="form-row">
      <label for="company">会社名</label>
      <input type="text" id="company" name="company">
    </div>

    <div class="form-row">
      <label for="name">お名前</label>
      <input type="text" id="name" name="name">
    </div>

    <div class="form-row">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email">
    </div>

    <div class="form-row">
      <label for="tel">電話番号</label>
      <input type="tel" id="tel" name="tel">
    </div>

    <div class="form-row">
      <label for="kind">お問い合わせ種別</label>
      <select id="kind" name="kind">
        <option value="">選択してください</option>
        <option value="product">製品について</option>
        <option value="recruit">採用について</option>
        <option value="other">その他</option>
      </select>
    </div>

    <div class="form-row">
      <label for="message">お問い合わせ内容</label>
      <textarea id="message" name="message" rows="8"></textarea>
    </div>

    <div class="form-row checkbox-row">
      <input type="checkbox" id="agree" name="agree" required>
      <label for="agree">個人情報の取り扱いに同意する</label>
    </div>

    <button type="submit">送信する</button>
  </form>
</main>

<footer>
  &copy; テスト株式会社（ネコノテ検証用） ― これはダミーサイトです
</footer>
</body>
</html>
