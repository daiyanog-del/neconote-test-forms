<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>送信完了 | テスト株式会社（ネコノテ検証用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="notice-banner">
  これはネコノテアクションの動作検証用のダミーサイトです。実在の企業ではありません。
</div>

<header>
  <p class="site-title">テスト株式会社（ネコノテ検証用）</p>
</header>

<nav>
  <a href="index.html">会社概要</a>
  <a href="contact.html">お問い合わせ</a>
  <a href="contact2.html">お問い合わせ（詳細フォーム）</a>
</nav>

<main>
  <h1>お問い合わせを受け付けました（ダミー）</h1>
  <p id="received-at"></p>

  <table id="result-table">
    <thead>
      <tr><th>項目名</th><th>入力内容</th></tr>
    </thead>
    <tbody id="result-body">
      <!-- JSでURLクエリの内容を出力する -->
    </tbody>
  </table>
  <p id="no-params-message" style="display:none;">受信したパラメータはありません。</p>
  <p id="record-status"></p>
</main>

<footer>
  &copy; テスト株式会社（ネコノテ検証用） ― これはダミーサイトです
</footer>

<script>
// 記録サーバー（Render上のFastAPI）のエンドポイント。
// 後で司令塔が差し替えられるよう、この1箇所にまとめてある。
const INBOX_URL = "https://neconote-test-inbox.onrender.com/submissions";

// 受信日時（クライアント時刻）を表示する
document.getElementById('received-at').textContent =
  '受信日時: ' + new Date().toLocaleString('ja-JP');

// URLクエリの全キー・値を表形式で表示する
// XSS対策として textContent を使い、innerHTML は使用しない
const params = new URLSearchParams(window.location.search);
const tbody = document.getElementById('result-body');
let count = 0;

for (const [key, value] of params.entries()) {
  count++;
  const tr = document.createElement('tr');

  const th = document.createElement('th');
  th.textContent = key;

  const td = document.createElement('td');
  td.textContent = value === '' ? '(空)' : value;

  tr.appendChild(th);
  tr.appendChild(td);
  tbody.appendChild(tr);
}

if (count === 0) {
  document.getElementById('result-table').style.display = 'none';
  document.getElementById('no-params-message').style.display = 'block';
}

// クエリが空（直接開いた場合）でなければ記録サーバーへ送信する
const recordStatus = document.getElementById('record-status');

if (count > 0) {
  const fields = {};
  for (const [key, value] of params.entries()) {
    fields[key] = value;
  }

  // 送信元ページのパスは referrer から取る（無ければ "unknown"）
  let page = 'unknown';
  if (document.referrer) {
    try {
      page = new URL(document.referrer).pathname;
    } catch (e) {
      page = 'unknown';
    }
  }

  recordStatus.textContent = '記録サーバーへ送信中…（無料サーバーのため初回は最大1分かかります）';

  fetch(INBOX_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      page: page,
      received_at: new Date().toISOString(),
      fields: fields,
    }),
  })
    .then((res) => {
      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }
      return res.json();
    })
    .then((data) => {
      recordStatus.textContent = '記録済み（受付番号 ' + data.id + '）';
    })
    .catch((err) => {
      recordStatus.textContent = '記録に失敗しました: ' + err.message;
    });
}
</script>
</body>
</html>
