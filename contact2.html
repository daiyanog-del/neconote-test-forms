<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>お問い合わせ（詳細フォーム） | テスト株式会社（ネコノテ検証用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="notice-banner">
  これはネコノテアクションの動作検証用のダミーサイトです。実在の企業ではありません。
</div>

<header>
  <p class="site-title">テスト株式会社（ネコノテ検証用）</p>
</header>

<nav>
  <a href="index.html">会社概要</a>
  <a href="contact.html">お問い合わせ</a>
  <a href="contact2.html">お問い合わせ（詳細フォーム）</a>
</nav>

<main>
  <h1>お問い合わせ（詳細フォーム）</h1>
  <p>以下のフォームに必要事項をご記入のうえ「確認画面へ」を押してください。内容確認後に送信できます。</p>

  <form id="contact2-form" method="GET" action="thanks.html">
  <div id="input-screen">

    <div class="form-row">
      <label for="company">会社名</label>
      <input type="text" id="company" name="company">
    </div>

    <div class="form-row">
      <label for="department">部署名</label>
      <input type="text" id="department" name="department">
    </div>

    <div class="form-row">
      <label for="position">役職</label>
      <input type="text" id="position" name="position">
    </div>

    <div class="half-row">
      <div class="form-row">
        <label for="sei">姓</label>
        <input type="text" id="sei" name="sei">
      </div>
      <div class="form-row">
        <label for="mei">名</label>
        <input type="text" id="mei" name="mei">
      </div>
    </div>

    <div class="half-row">
      <div class="form-row">
        <label for="sei_kana">セイ</label>
        <input type="text" id="sei_kana" name="sei_kana">
      </div>
      <div class="form-row">
        <label for="mei_kana">メイ</label>
        <input type="text" id="mei_kana" name="mei_kana">
      </div>
    </div>

    <div class="form-row">
      <label for="zip">郵便番号</label>
      <input type="text" id="zip" name="zip">
    </div>

    <div class="form-row">
      <label for="pref">都道府県</label>
      <select id="pref" name="pref">
        <option value="">選択してください</option>
        <option value="北海道">北海道</option>
        <option value="青森県">青森県</option>
        <option value="岩手県">岩手県</option>
        <option value="宮城県">宮城県</option>
        <option value="秋田県">秋田県</option>
        <option value="山形県">山形県</option>
        <option value="福島県">福島県</option>
        <option value="茨城県">茨城県</option>
        <option value="栃木県">栃木県</option>
        <option value="群馬県">群馬県</option>
        <option value="埼玉県">埼玉県</option>
        <option value="千葉県">千葉県</option>
        <option value="東京都">東京都</option>
        <option value="神奈川県">神奈川県</option>
        <option value="新潟県">新潟県</option>
        <option value="富山県">富山県</option>
        <option value="石川県">石川県</option>
        <option value="福井県">福井県</option>
        <option value="山梨県">山梨県</option>
        <option value="長野県">長野県</option>
        <option value="岐阜県">岐阜県</option>
        <option value="静岡県">静岡県</option>
        <option value="愛知県">愛知県</option>
        <option value="三重県">三重県</option>
        <option value="滋賀県">滋賀県</option>
        <option value="京都府">京都府</option>
        <option value="大阪府">大阪府</option>
        <option value="兵庫県">兵庫県</option>
        <option value="奈良県">奈良県</option>
        <option value="和歌山県">和歌山県</option>
        <option value="鳥取県">鳥取県</option>
        <option value="島根県">島根県</option>
        <option value="岡山県">岡山県</option>
        <option value="広島県">広島県</option>
        <option value="山口県">山口県</option>
        <option value="徳島県">徳島県</option>
        <option value="香川県">香川県</option>
        <option value="愛媛県">愛媛県</option>
        <option value="高知県">高知県</option>
        <option value="福岡県">福岡県</option>
        <option value="佐賀県">佐賀県</option>
        <option value="長崎県">長崎県</option>
        <option value="熊本県">熊本県</option>
        <option value="大分県">大分県</option>
        <option value="宮崎県">宮崎県</option>
        <option value="鹿児島県">鹿児島県</option>
        <option value="沖縄県">沖縄県</option>
      </select>
    </div>

    <div class="form-row">
      <label for="address">住所</label>
      <input type="text" id="address" name="address">
    </div>

    <div class="form-row">
      <label>電話番号</label>
      <div class="tel-split">
        <input type="text" id="tel1" name="tel1" maxlength="4">
        <span>-</span>
        <input type="text" id="tel2" name="tel2" maxlength="4">
        <span>-</span>
        <input type="text" id="tel3" name="tel3" maxlength="4">
      </div>
    </div>

    <div class="form-row">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email">
    </div>

    <div class="form-row">
      <label for="email_confirm">メールアドレス（確認）</label>
      <input type="email" id="email_confirm" name="email_confirm">
    </div>

    <div class="form-row">
      <label for="url">ホームページURL</label>
      <input type="url" id="url" name="url">
    </div>

    <div class="form-row">
      <label for="subject">件名</label>
      <input type="text" id="subject" name="subject">
    </div>

    <div class="form-row">
      <label for="message">お問い合わせ内容</label>
      <textarea id="message" name="message" rows="8"></textarea>
    </div>

    <div class="form-row checkbox-row">
      <input type="checkbox" id="agree" name="agree" required>
      <label for="agree">個人情報の取り扱いに同意する</label>
    </div>

    <button type="button" id="to-confirm-button">確認画面へ</button>
  </div>

  <div id="confirm-screen">
    <h2>入力内容の確認</h2>
    <table id="confirm-table">
      <tbody id="confirm-body">
        <!-- JSで入力内容を出力する -->
      </tbody>
    </table>
    <button type="button" id="back-button" class="secondary">戻る</button>
    <button type="button" id="submit-button">送信する</button>
  </div>

  </form>
</main>

<footer>
  &copy; テスト株式会社（ネコノテ検証用） ― これはダミーサイトです
</footer>

<script>
// 確認画面フロー:
// 1. 「確認画面へ」クリックで送信はせず、入力画面(#input-screen)を隠し
//    フォームの各値を#confirm-body に textContent で一覧表示して確認画面(#confirm-screen)を出す
// 2. 「戻る」で入力画面に戻る（値は保持されたまま）
// 3. 「送信する」でform.submit()を呼び、初めてGETでthanks.htmlへ送信する

const form = document.getElementById('contact2-form');
const inputScreen = document.getElementById('input-screen');
const confirmScreen = document.getElementById('confirm-screen');
const confirmBody = document.getElementById('confirm-body');

// 確認画面に表示する項目（ラベル, name）の対応表
const fields = [
  ['会社名', 'company'],
  ['部署名', 'department'],
  ['役職', 'position'],
  ['姓', 'sei'],
  ['名', 'mei'],
  ['セイ', 'sei_kana'],
  ['メイ', 'mei_kana'],
  ['郵便番号', 'zip'],
  ['都道府県', 'pref'],
  ['住所', 'address'],
  ['電話番号1', 'tel1'],
  ['電話番号2', 'tel2'],
  ['電話番号3', 'tel3'],
  ['メールアドレス', 'email'],
  ['メールアドレス（確認）', 'email_confirm'],
  ['ホームページURL', 'url'],
  ['件名', 'subject'],
  ['お問い合わせ内容', 'message'],
];

document.getElementById('to-confirm-button').addEventListener('click', function () {
  confirmBody.textContent = '';

  for (const [label, name] of fields) {
    const el = form.elements[name];
    const value = el ? el.value : '';

    const tr = document.createElement('tr');
    const th = document.createElement('th');
    th.textContent = label;
    const td = document.createElement('td');
    td.textContent = value === '' ? '(空)' : value;

    tr.appendChild(th);
    tr.appendChild(td);
    confirmBody.appendChild(tr);
  }

  inputScreen.style.display = 'none';
  confirmScreen.style.display = 'block';
});

document.getElementById('back-button').addEventListener('click', function () {
  confirmScreen.style.display = 'none';
  inputScreen.style.display = 'block';
});

document.getElementById('submit-button').addEventListener('click', function () {
  form.submit();
});
</script>
</body>
</html>
